<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Wind turbine favicon: blue turbine on a neutral white background -->
  <rect x="0" y="0" width="32" height="32" rx="6" fill="#ffffff" />
  <rect x="14.5" y="14.5" width="3" height="16" rx="1.5" fill="#3f7fd6" />
  <g fill="#4a90e2" transform="rotate(18 16 15)">
    <!-- Paddles at 120° apart, offset by 30° so none points straight up -->
    <ellipse cx="16" cy="7.8" rx="2.3" ry="7.2" />
    <ellipse cx="16" cy="7.8" rx="2.3" ry="7.2" transform="rotate(120 16 15)" />
    <ellipse cx="16" cy="7.8" rx="2.3" ry="7.2" transform="rotate(240 16 15)" />
  </g>
  <circle cx="16" cy="15" r="2.5" fill="#2f6fc4" />
</svg>
